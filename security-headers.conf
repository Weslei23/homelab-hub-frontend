# Cabecalhos de seguranca, incluidos em cada "location" do nginx.conf.
# (No nginx, um add_header dentro de um location anula os do server; por isso o include em cada um.)

# Nao deixa o dashboard ser aberto dentro de um iframe de outro site (clickjacking)
add_header X-Frame-Options "DENY" always;
# O navegador respeita o Content-Type informado (nao "adivinha" que um arquivo e script)
add_header X-Content-Type-Options "nosniff" always;
# Links para outros sites nao levam o endereco completo do dashboard
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Recursos do navegador que o dashboard nao usa
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# So roda scripts do proprio dashboard. Imagens podem vir de fora: icones personalizados dos cards,
# capas do Jellyfin (http na rede local) e capas da busca de filmes/series (TMDB/TVDB).
# 'unsafe-inline' em estilos: o Vue usa style="..." nas barras de progresso.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
